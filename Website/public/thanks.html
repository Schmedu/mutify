<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Mutify</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Shantell+Sans:ital,wght,BNCE,INFM@0,300..800,-100..100,0..100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/_shared.css">
<meta name="theme-color" content="#d9d8ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a2b" media="(prefers-color-scheme: dark)">
<script>
  try {
    const t = localStorage.getItem('mutify-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
<style>
  body{ --page:64rem; }
  .stage{ display:grid; gap:clamp(1.5rem,4vw,3.5rem); align-items:center; }
  @media (min-width:56rem){
    .stage{ grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); align-items:start; }
    .pal{ position:sticky; top:3rem; margin-top:2.5rem !important; }
  }
  .pal{ margin:0; width:min(100%, 24rem); justify-self:center; }
  @media (max-width:55.99rem){ .pal{ order:-1; width:min(72%, 17rem); } }

  .state{ min-height:16rem; }
  .state h1{ margin-top:1.1rem; }
  .lede{ margin-top:1.4rem; font-size:clamp(1.125rem,1.05rem + .35vw,1.3rem); color:var(--ink-2); max-width:42ch; line-height:1.5; }
  .actions{ margin-top:2rem; display:flex; flex-wrap:wrap; gap:1rem; align-items:center; }

  /* the receipt, a slip of paper */
  .receipt{ margin:2.5rem 0 0; padding:1.1rem 1.4rem; max-width:30rem; rotate:.6deg; font-size:.9375rem; }
  .receipt div{ display:flex; justify-content:space-between; gap:1.5rem; padding:.55rem 0;
    background:linear-gradient(90deg, color-mix(in oklab, var(--line) 30%, transparent) 50%, transparent 0) 0 100% / 10px 2px repeat-x; }
  .receipt div:last-child{ background:none; }
  .receipt dt{ color:var(--ink-3); font-family:var(--hand); font-weight:600; }
  .receipt dd{ margin:0; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; }

  .next{ margin-top:2.75rem; }
  .next ol{ margin:1.1rem 0 0; padding:0; list-style:none; display:grid; gap:.8rem; color:var(--ink-2); max-width:46ch; counter-reset:step; }
  .next li{ display:grid; grid-template-columns:2rem 1fr; align-items:baseline; }
  .next li::before{ counter-increment:step; content:counter(step) "."; font-family:var(--hand); font-weight:800; font-size:1.2rem;
    color:var(--noise); font-variation-settings:"INFM" 80, "BNCE" 50; }
  .hint{ margin-top:1.4rem; font-size:.9rem; color:var(--ink-3); max-width:46ch; line-height:1.55; }

  /* a hand-drawn loop that keeps going round while Stripe is asked */
  .spin{ width:1.05em; height:1.05em; vertical-align:-.18em; margin-right:.2em; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round;
    animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* the laptop's face follows the page: waiting, paid, or puzzled */
  .pal .f-yay, .pal .f-huh, .pal .yay, .pal .huh{ opacity:0; }
  body[data-state="paid"] .pal .f-wait, body[data-state="fail"] .pal .f-wait, body[data-state="paid"] .pal .wait, body[data-state="fail"] .pal .wait{ opacity:0; }
  body[data-state="paid"] .pal .f-yay, body[data-state="paid"] .pal .yay{ opacity:1; }
  body[data-state="fail"] .pal .f-huh, body[data-state="fail"] .pal .huh{ opacity:1; }
  .pal .sticker{ transform:scale(2.4) rotate(-24deg); }
  body[data-state="paid"] .pal .sticker{ transform:none; transition:transform .32s cubic-bezier(.55,0,1,.45); }
  @media (prefers-reduced-motion:no-preference){
    .pal .look{ animation:look 2.2s ease-in-out infinite; }
    @keyframes look{ 0%,100%{ transform:translate(-6px,0); } 45%,55%{ transform:translate(6px,0); } }
    .pal .dots circle{ animation:dot 1.2s ease-in-out infinite; }
    .pal .dots circle:nth-child(2){ animation-delay:.2s; }
    .pal .dots circle:nth-child(3){ animation-delay:.4s; }
    @keyframes dot{ 0%,60%,100%{ transform:translateY(0); } 30%{ transform:translateY(-7px); } }
    body[data-state="paid"] .pal .spark{ animation:twinkle 1.6s ease-in-out infinite; }
    body[data-state="paid"] .pal .spark.s2{ animation-delay:.5s; }
    body[data-state="paid"] .pal .spark.s3{ animation-delay:1s; }
    @keyframes twinkle{ 0%,100%{ transform:scale(.6) rotate(0); opacity:.4; } 50%{ transform:scale(1.1) rotate(20deg); opacity:1; } }
  }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } }
</style>
</head>
<body data-state="wait">

<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="3" result="n">
      <animate attributeName="seed" values="3;8;14;21;27" dur=".62s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header>
  <div class="wrap bar">
    <a class="mark" href="/"><img src="/img/icon.webp" alt="" width="30" height="30"> Mutify</a>
    <button class="theme" id="theme" type="button" aria-label="Switch between light and dark">

    </button>
  </div>
  <div class="rule" aria-hidden="true"></div>
</header>

<footer>
  <div class="rule" aria-hidden="true"></div>
  <div class="wrap foot-row">
    <span>Trouble? <a href="mailto:e@uffelmann.me">e@uffelmann.me</a></span>
    <span><a href="https://github.com/Schmedu/mutify">Source</a></span>
    <span><a href="/legal">Imprint</a></span>
  </div>
</footer>

<script type="module">
if (!matchMedia('(prefers-reduced-motion: no-preference)').matches) {
  document.querySelectorAll('.defs animate').forEach((a) => a.remove());
}

const root = document.documentElement;
document.getElementById('theme').addEventListener('click', () => {
  const dark = root.dataset.theme
    ? root.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('mutify-theme', root.dataset.theme); } catch {}
});

const state = document.getElementById('state');
const params = new URLSearchParams(location.search);
const sessionId = params.get('session_id') ?? '';

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const money = (cents, cur) =>
  (cents / 100).toLocaleString('de-DE', { style: 'currency', currency: (cur ?? 'eur').toUpperCase() });

function fail(head, body) {
  document.body.dataset.state = 'fail';
  state.innerHTML = `
    <p class="eyebrow">Nothing to unlock</p>
    <h1>${esc(head)}</h1>
    <p class="lede">${esc(body)}</p>
    <div class="actions">
      <a class="btn btn-brand" href="/#buy">Back to the page</a>
      <a class="btn" href="https://github.com/Schmedu/mutify/releases/latest">Free download on GitHub</a>
    </div>`;
}

if (!sessionId) {
  fail('This page needs a receipt.', 'It opens by itself after a payment. If you just bought Mutify and landed here empty-handed, email me and I will send the build straight over.');
} else {
  try {
    const res = await fetch(`/api/download?json=1&session_id=${encodeURIComponent(sessionId)}`);
    const data = await res.json();

    if (!data.paid) {
      fail("That payment hasn't cleared.", data.error ?? 'Stripe has no completed payment for this link. Nothing was charged.');
    } else {
      const href = `/api/download?session_id=${encodeURIComponent(sessionId)}`;
      document.body.dataset.state = 'paid';
      state.innerHTML = `
        <p class="eyebrow">Paid — thank you</p>
        <h1>Mutify is yours.</h1>
        <p class="lede">Mutify ${esc(data.version)} for macOS, signed and notarized. Keep this page — the link works as long as you have it.</p>
        <div class="actions">
          <a class="btn btn-brand" href="${href}" id="dl">Download Mutify ${esc(data.version)}</a>
          <a class="btn" href="https://github.com/Schmedu/mutify/blob/main/README.md">Read the manual</a>
        </div>
        <dl class="receipt sheet">
          <div><dt>Paid</dt><dd>${esc(money(data.amount, data.currency))}</dd></div>
          ${data.email ? `<div><dt>Receipt sent to</dt><dd>${esc(data.email)}</dd></div>` : ''}
          <div><dt>Requires</dt><dd>macOS 14+, Apple Silicon</dd></div>
        </dl>
        <div class="next">
          <h2>Then, once:</h2>
          <ol>
            <li>Open the DMG and drag Mutify to Applications.</li>
            <li>Launch it. It's notarized, so there's no Gatekeeper detour.</li>
            <li>Add the Wi-Fi you're on now to the allow list — everything else is muted until you say otherwise.</li>
          </ol>
          <p class="hint">If the menu bar icon doesn't appear, your menu bar is full and macOS parked it out of sight. Open Mutify again and its window comes up with every control the menu has.</p>
        </div>`;
      // Start the download without making them click twice.
      setTimeout(() => { location.href = href; }, 900);
    }
  } catch {
    fail("Couldn't reach Stripe.", 'The payment is fine — this page just could not check it. Reload in a moment, or email e@uffelmann.me and I will send the build over.');
  }
}
</script>
</body>
